name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine builds and passes its 64k assertions with no Python toolchain
  # at all. Kept as a separate job so a broken ML dependency can never turn the
  # C++ badge red.
  cpp:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        # -march=native is off: GitHub runners are heterogeneous and the flag
        # is a performance choice, not a correctness one.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_NATIVE_ARCH=OFF
          -DBUILD_PYTHON_MODULE=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  # The engine hand-manages a memory arena and the queue is lock-free. Neither
  # class of bug reliably shows up as a test failure -- they show up as
  # corruption much later, or only under a scheduling the runner never
  # reproduces. The sanitizers are the only thing that actually checks them.
  sanitizers:
    name: Sanitizers (ASan/UBSan, TSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
              -I csrc/include csrc/src/*.cpp tests/test_pcsr.cpp -o asan_pcsr
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
              ./asan_pcsr

      - name: ThreadSanitizer on the lock-free queue
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=thread -pthread -I csrc/include \
              csrc/src/*.cpp tests/test_spsc.cpp -o tsan_spsc
          TSAN_OPTIONS=halt_on_error=1 ./tsan_spsc

  python:
    name: Python (models, strategy, backtest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default wheel pulls ~2 GB of CUDA that no
          # runner here can use.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pybind11 numpy pandas networkx psutil pyarrow

      - name: Build the extension
        run: make ext ARCH_FLAGS=

      - name: Model tests (time encoding, sampler, attention, causality)
        run: python tests/test_tgat.py

      - name: Strategy and backtest tests
        run: python tests/test_strategy.py

  lint:
    name: Compile warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with warnings as errors
        # The engine is small enough that -Werror is realistic, and a warning
        # in memory-management code is worth failing a build over.
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I csrc/include -fsyntax-only \
              csrc/src/memory_arena.cpp csrc/src/pcsr_graph.cpp
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -I csrc/include \
              -fsyntax-only tests/test_spsc.cpp
